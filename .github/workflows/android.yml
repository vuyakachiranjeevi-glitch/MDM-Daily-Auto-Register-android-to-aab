name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ ! -z "$ENCODED_KEYSTORE" ]; then
          echo $ENCODED_KEYSTORE | base64 --decode > android_keystore.jks
        fi

    - name: Build with Gradle
      env:
        ANDROID_KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/android_keystore.jks', github.workspace) || '' }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: ./gradlew clean :app:bundleRelease --stacktrace --no-daemon

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-release.aab
        path: app/build/outputs/bundle/release/app-release.aab
