name: Build Release AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Production Keystore
      run: |
        keytool -genkeypair -v -keystore android.keystore -alias mdm-release-key \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=ClowdZone, OU=Mobile Solutions, O=ClowdZone, L=Visakhapatnam, ST=Andhra Pradesh, C=IN" \
          -storepass ClowdZone@2026 -keypass ClowdZone@2026

    - name: Grant Execute Permission
      run: chmod +x ./gradlew

    - name: Build Signed Release AAB
      env:
        ANDROID_KEY_ALIAS: mdm-release-key
        ANDROID_KEYSTORE_PASSWORD: ClowdZone@2026
        ANDROID_KEY_PASSWORD: ClowdZone@2026
        ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android.keystore
      run: ./gradlew bundleRelease --stacktrace

    - name: Upload AAB and Keystore Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-release-and-keystore
        path: |
          app/build/outputs/bundle/release/*.aab
          android.keystore
